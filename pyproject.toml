[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["orcha_agent", "benchmarks"]
exclude = ["tests"]
# Explicit file baseline preserves Phase 0 scope; remove entries as files are fixed.
ignore = [
    "orcha_agent/__main__.py",
    "orcha_agent/builtin/advisor.py",
    "orcha_agent/builtin/commands_core.py",
    "orcha_agent/builtin/commands_model.py",
    "orcha_agent/builtin/commands_review.py",
    "orcha_agent/builtin/commands_session.py",
    "orcha_agent/builtin/provider_codex.py",
    "orcha_agent/builtin/provider_ollama.py",
    "orcha_agent/core/agent.py",
    "orcha_agent/core/agents.py",
    "orcha_agent/core/ledger.py",
    "orcha_agent/core/loader.py",
    "orcha_agent/core/registry.py",
    "orcha_agent/tui/blocks/hud.py",
    "orcha_agent/tui/blocks/task.py",
    "orcha_agent/tui/blocks/tool.py",
    "orcha_agent/tui/composer.py",
    "orcha_agent/tui/context.py",
    "orcha_agent/tui/gallery.py",
    "orcha_agent/tui/keys.py",
    "orcha_agent/tui/overlays/base.py",
    "orcha_agent/tui/overlays/help.py",
    "orcha_agent/tui/overlays/hub.py",
    "orcha_agent/tui/overlays/session.py",
    "orcha_agent/tui/queue.py",
    "orcha_agent/tui/runtime.py",
    "orcha_agent/tui/statusline.py",
    "orcha_agent/tui/transcript.py",
    "orcha_agent/tui/turn.py",
]

[tool.coverage.run]
branch = true
source = ["orcha_agent"]
omit = ["tests/*"]

[tool.coverage.report]
# Phase 0: enforce fail_under later
show_missing = true
skip_covered = true
