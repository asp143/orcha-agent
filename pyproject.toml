[project]
name = "orcha-agent"
version = "0.1.0"
description = "Pluggable terminal coding agent built on deepagents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.9,<0.8",
    "langchain-anthropic>=1.6.1",
    "langchain-openai>=1.6.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
orcha = "orcha_agent.__main__:main"

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.6.0",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
google = [
    "langchain-google-genai>=4.3.5",
]
codex = [
    "langchain-openai>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["orcha_agent/tui/themes/*.json", "orcha_agent/tui/keybindings.toml", "orcha_agent/tui/tips.txt"]

[tool.hatch.build.targets.wheel]
packages = ["orcha_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
