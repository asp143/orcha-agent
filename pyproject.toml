[project]
name = "orcha-agent"
version = "0.1.0"
description = "Pluggable terminal coding agent built on deepagents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.9,<0.8",
    "langchain-anthropic>=1.6.1",
    "langchain-openai>=1.6.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
orcha = "orcha_agent.__main__:main"

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.6.0",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
google = [
    "langchain-google-genai>=4.3.5",
]
codex = [
    "langchain-openai>=1.6.0",
]
turso = [
    "libsql>=0.1.11,<0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["orcha_agent/tui/themes/*.json", "orcha_agent/tui/keybindings.toml", "orcha_agent/tui/tips.txt"]

[tool.hatch.build.targets.wheel]
packages = ["orcha_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyright>=1.1.411",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Explicit F401 file baseline preserves Phase 0 scope; remove entries as files are fixed.
"orcha_agent/tui/blocks/__init__.py" = ["E402"]
"orcha_agent/tui/blocks/tool.py" = ["E701", "E702", "F401"]
"tests/tui/test_block_registry.py" = ["E731"]
"tests/test_registry.py" = ["E731"]
"tests/tui/test_overlays.py" = ["E731"]
"tests/tui/test_stage4_components.py" = ["E731", "F401"]
"orcha_agent/builtin/statusbar.py" = ["F401"]
"orcha_agent/tui/app.py" = ["F401"]
"orcha_agent/tui/blocks/hud.py" = ["F401"]
"orcha_agent/tui/complete.py" = ["F401"]
"orcha_agent/tui/overlays/base.py" = ["F401"]
"orcha_agent/tui/runtime.py" = ["F401"]
"tests/test_statusline.py" = ["F401"]
"tests/test_commands.py" = ["F821"]

[tool.ruff.format]
# Explicit file baseline preserves Phase 0 scope; remove entries as files are formatted.
exclude = [
    "orcha_agent/builtin/approval_prompt.py",
    "orcha_agent/builtin/banner.py",
    "orcha_agent/builtin/commands_core.py",
    "orcha_agent/builtin/commands_model.py",
    "orcha_agent/builtin/commands_session.py",
    "orcha_agent/builtin/provider_codex.py",
    "orcha_agent/core/agent.py",
    "orcha_agent/core/auth.py",
    "orcha_agent/core/config.py",
    "orcha_agent/core/events.py",
    "orcha_agent/core/export.py",
    "orcha_agent/core/ledger.py",
    "orcha_agent/core/loader.py",
    "orcha_agent/core/models.py",
    "orcha_agent/core/plugin.py",
    "orcha_agent/core/registry.py",
    "orcha_agent/core/session.py",
    "orcha_agent/tui/blocks/__init__.py",
    "orcha_agent/tui/blocks/assistant.py",
    "orcha_agent/tui/blocks/diff.py",
    "orcha_agent/tui/blocks/hud.py",
    "orcha_agent/tui/blocks/thinking.py",
    "orcha_agent/tui/blocks/tool.py",
    "orcha_agent/tui/blocks/welcome.py",
    "orcha_agent/tui/complete.py",
    "orcha_agent/tui/composer.py",
    "orcha_agent/tui/context.py",
    "orcha_agent/tui/frame.py",
    "orcha_agent/tui/gallery_fixtures/blocks.py",
    "orcha_agent/tui/history.py",
    "orcha_agent/tui/keys.py",
    "orcha_agent/tui/notify.py",
    "orcha_agent/tui/overlays/__init__.py",
    "orcha_agent/tui/overlays/approval.py",
    "orcha_agent/tui/overlays/ask.py",
    "orcha_agent/tui/overlays/history.py",
    "orcha_agent/tui/overlays/select.py",
    "orcha_agent/tui/overlays/tree.py",
    "orcha_agent/tui/queue.py",
    "orcha_agent/tui/runtime.py",
    "orcha_agent/tui/statusline.py",
    "orcha_agent/tui/symbols.py",
